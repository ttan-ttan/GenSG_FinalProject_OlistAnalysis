name: Deploy to Microsoft Fabric

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_PIPELINE_ID: ${{ secrets.FABRIC_PIPELINE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}

      # Bronze
      NB_BRONZE_CUSTOMERS: ${{ secrets.BRONZE_CUSTOMERS }}
      NB_BRONZE_GEOLOCATION: ${{ secrets.BRONZE_GEOLOCATION }}
      NB_BRONZE_ORDERREVIEWS: ${{ secrets.BRONZE_ORDERREVIEWS }}
      NB_BRONZE_ORDERS: ${{ secrets.BRONZE_ORDERS }}
      NB_BRONZE_ORDER_ITEMS: ${{ secrets.BRONZE_ORDER_ITEMS }}
      NB_BRONZE_PAYMENTS: ${{ secrets.BRONZE_PAYMENTS }}
      NB_BRONZE_PRODUCTCATEGORYNAME: ${{ secrets.BRONZE_PRODUCTCATEGORYNAME }}
      NB_BRONZE_PRODUCTS: ${{ secrets.BRONZE_PRODUCTS }}
      NB_BRONZE_SELLERS: ${{ secrets.BRONZE_SELLERS }}

      # Silver
      NB_SILVER_CUSTOMERS: ${{ secrets.SILVER_CUSTOMERS }}
      NB_SILVER_GEOLOCATION: ${{ secrets.SILVER_GEOLOCATION }}
      NB_SILVER_ORDERREVIEWS: ${{ secrets.SILVER_ORDERREVIEWS }}
      NB_SILVER_ORDERS: ${{ secrets.SILVER_ORDERS }}
      NB_SILVER_ORDER_ITEMS: ${{ secrets.SILVER_ORDER_ITEMS }}
      NB_SILVER_PAYMENTS: ${{ secrets.SILVER_PAYMENTS }}
      NB_SILVER_PRODUCTCATEGORYNAME: ${{ secrets.SILVER_PRODUCTCATEGORYNAME }}
      NB_SILVER_PRODUCTS: ${{ secrets.SILVER_PRODUCTS }}
      NB_SILVER_SELLERS: ${{ secrets.SILVER_SELLERS }}

      # Gold
      NB_GOLD_CUSTOMERS: ${{ secrets.GOLD_CUSTOMERS }}
      NB_GOLD_DIMCUSTOMER: ${{ secrets.GOLD_DIMCUSTOMER }}
      NB_GOLD_DIMPRODUCT: ${{ secrets.GOLD_DIMPRODUCT }}
      NB_GOLD_DIMSELLER: ${{ secrets.GOLD_DIMSELLER }}
      NB_GOLD_FACTORDERS: ${{ secrets.GOLD_FACTORDERS }}
      NB_GOLD_FACTPAYMENTS: ${{ secrets.GOLD_FACTPAYMENTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Acquire Fabric Access Token
        id: get_token
        run: |
          response=$(curl -X POST -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=$CLIENT_ID&client_secret=$CLIENT_SECRET&scope=https://api.fabric.microsoft.com/.default" \
            "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token")
          echo "FABRIC_ACCESS_TOKEN=$(echo $response | jq -r '.access_token')" >> $GITHUB_ENV

      - name: Run unit tests
        run: pytest -q

      - name: Upload src folder to OneLake
        run: python .github/scripts/upload_src_folder.py

      # BRONZE NOTEBOOKS

      - name: Deploy Bronze Customers
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_Customers.notebook/notebook-content.json $NB_BRONZE_CUSTOMERS

      - name: Deploy Bronze Geolocation
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_Geolocation.notebook/notebook-content.json $NB_BRONZE_GEOLOCATION

      - name: Deploy Bronze Order Items
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_Order_Items.notebook/notebook-content.json $NB_BRONZE_ORDER_ITEMS

      - name: Deploy Bronze Order Reviews
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_OrderReviews.notebook/notebook-content.json $NB_BRONZE_ORDERREVIEWS

      - name: Deploy Bronze Orders
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_Orders.notebook/notebook-content.json $NB_BRONZE_ORDERS

      - name: Deploy Bronze Payments
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_Payments.notebook/notebook-content.json $NB_BRONZE_PAYMENTS

      - name: Deploy Bronze Product Category Name
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_ProductCategoryName.notebook/notebook-content.json $NB_BRONZE_PRODUCTCATEGORYNAME

      - name: Deploy Bronze Products
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_Products.notebook/notebook-content.json $NB_BRONZE_PRODUCTS

      - name: Deploy Bronze Sellers
        run: python .github/scripts/deploy_notebook.py notebooks/Bronze_Sellers.notebook/notebook-content.json $NB_BRONZE_SELLERS

      # SILVER NOTEBOOKS

      - name: Deploy Silver Customers
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_Customers.notebook/notebook-content.json $NB_SILVER_CUSTOMERS

      - name: Deploy Silver Geolocation
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_Geolocation.notebook/notebook-content.json $NB_SILVER_GEOLOCATION

      - name: Deploy Silver Order Items
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_Order_Items.notebook/notebook-content.json $NB_SILVER_ORDER_ITEMS

      - name: Deploy Silver Order Reviews
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_OrderReviews.notebook/notebook-content.json $NB_SILVER_ORDERREVIEWS

      - name: Deploy Silver Orders
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_Orders.notebook/notebook-content.json $NB_SILVER_ORDERS

      - name: Deploy Silver Payments
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_Payments.notebook/notebook-content.json $NB_SILVER_PAYMENTS

      - name: Deploy Silver Product Category Name
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_ProductCategoryName.notebook/notebook-content.json $NB_SILVER_PRODUCTCATEGORYNAME

      - name: Deploy Silver Products
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_Products.notebook/notebook-content.json $NB_SILVER_PRODUCTS

      - name: Deploy Silver Sellers
        run: python .github/scripts/deploy_notebook.py notebooks/Silver_Sellers.notebook/notebook-content.json $NB_SILVER_SELLERS

      # GOLD NOTEBOOKS

      - name: Deploy Gold Customers
        run: python .github/scripts/deploy_notebook.py notebooks/Gold_Customers.notebook/notebook-content.json $NB_GOLD_CUSTOMERS

      - name: Deploy Gold DimCustomer
        run: python .github/scripts/deploy_notebook.py notebooks/Gold_DimCustomer.notebook/notebook-content.json $NB_GOLD_DIMCUSTOMER

      - name: Deploy Gold DimProduct
        run: python .github/scripts/deploy_notebook.py notebooks/Gold_DimProduct.notebook/notebook-content.json $NB_GOLD_DIMPRODUCT

      - name: Deploy Gold DimSeller
        run: python .github/scripts/deploy_notebook.py notebooks/Gold_DimSeller.notebook/notebook-content.json $NB_GOLD_DIMSELLER

      - name: Deploy Gold FactOrders
        run: python .github/scripts/deploy_notebook.py notebooks/Gold_FactOrders.notebook/notebook-content.json $NB_GOLD_FACTORDERS

      - name: Deploy Gold FactPayments
        run: python .github/scripts/deploy_notebook.py notebooks/Gold_FactPayments.notebook/notebook-content.json $NB_GOLD_FACTPAYMENTS

      # TRIGGER PIPELINE

      - name: Trigger Fabric Pipeline
        run: python .github/scripts/trigger_pipeline.py
